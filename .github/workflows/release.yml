name: Release

# Push a tag like v1.0.1 to build signed APK + AAB and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Run tool/setup_github_secrets.sh once."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/nabby-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=nabby-release.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build
        run: |
          flutter build apk --release
          flutter build appbundle --release
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Nabby-$VERSION.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/Nabby-$VERSION.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f android/app/nabby-release.jks android/key.properties
