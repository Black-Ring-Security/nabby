name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Pull requests have no access to the signing key, so this is debug-signed.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nabby-unsigned-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
