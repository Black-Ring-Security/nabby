name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste passwords, private keys or real server addresses here.
        For security vulnerabilities, see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a host with key authentication
        2. Connect
        3. ...
  - type: input
    id: version
    attributes:
      label: Nabby version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Galaxy S22 Ultra, Android 16
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: SSH server
      placeholder: OpenSSH 9.8 on Ubuntu 24.04
